[workspace]
resolver = "2"
members = [
    "prediction_market",
    "ipredict_token",
    "referral_registry",
    "leaderboard",
]

[workspace.dependencies]
soroban-sdk = "26.0.1"

[workspace.metadata.audit]
# cargo-audit configuration for the workspace.
# Fail CI on any known vulnerability of moderate severity or higher.
severity-threshold = "moderate"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# Maximum allowed optimized WASM byte size per contract (64 KiB).
# Enforced by the CI WASM build verification job (issue #103).
[workspace.metadata.wasm-size-limit]
max-bytes = 65536
