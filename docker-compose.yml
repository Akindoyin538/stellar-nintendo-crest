version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: predictify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: predictify
      POSTGRES_PASSWORD: predictify
      POSTGRES_DB: predictify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictify -d predictify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: predictify-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  soroban:
    image: stellar/quickstart:latest
    container_name: predictify-soroban
    restart: unless-stopped
    command: ["--local", "--enable-soroban-rpc"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/soroban/rpc -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predictify-api
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://predictify:predictify@postgres:5432/predictify
      REDIS_URL: redis://redis:6379
      SOROBAN_RPC_URL: http://soroban:8000/soroban/rpc
      SEED_TEST_DATA: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      soroban:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: predictify-web
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
